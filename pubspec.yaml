name: lesbie
description: "App rankont pou fanm ak fanm - Entre Lesbi"
publish_to: 'none'
version: 1.0.5+8

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_database: ^11.1.4
  firebase_messaging: ^15.2.10
  go_router: ^14.3.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  flutter_stripe: ^10.2.0
  google_sign_in: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  agora_rtc_engine: ^6.5.3
  camera: ^0.12.0+1
  record: ^6.2.0
  audioplayers: ^6.6.0
  http: ^1.6.0
  path_provider: ^2.1.0
  video_player: ^2.11.1
  google_mlkit_face_detection: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#07070B"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lang/
    - assets/icons/
    - assets/logos/



